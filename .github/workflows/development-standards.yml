
name: BL .NET Development Standards

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  development-standards:
    name: Validate BL Development Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect .NET repository
        id: detect
        shell: bash
        run: |
          if git ls-files | grep -Eiq '\.(csproj|sln|slnx)$'; then
            echo "is_dotnet=true" >> "$GITHUB_OUTPUT"
            echo "A .NET project or solution was detected."
          else
            echo "is_dotnet=false" >> "$GITHUB_OUTPUT"
            echo "No .NET project or solution was detected."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.is_dotnet == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run BL development standards validation
        if: steps.detect.outputs.is_dotnet == 'true'
        env:
          VALIDATION_MODE: enforce
        run: node scripts/validate-standards.js

      - name: Skip non-.NET repository
        if: steps.detect.outputs.is_dotnet != 'true'
        run: echo "Skipping BL development standards validation."
